name: Publish to npm

# Publishes slashvibe-mcp from the PUBLIC source-of-record only, on a version
# tag (e.g. v0.8.17). Pre-publish: the checks that prove the tag, source,
# artifact and package are correct stop the release before it reaches npm.
# Post-publish: the verify job proves npm serves what production advertises
# (parity) and that the REGISTRY artifact conforms — loud on mismatch, never
# a deadlock (see scripts/version-parity.mjs for the 0.8.17 story).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need main to prove the tag is on a reviewed commit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json ($PKG) != tag ($TAG)"; exit 1
          fi
          echo "version verified: $PKG"

      - name: Verify tag points at reviewed main
        run: |
          # A release may only be cut from a commit that landed on main (i.e.
          # passed review). A tag on an unmerged branch cannot publish.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not on origin/main — refusing to publish"; exit 1
          fi
          echo "tag is on main: $GITHUB_SHA"

      - name: Install
        run: npm install

      - name: Pack closure
        run: npm run pack:check

      - name: Unit tests
        run: npm test

      - name: Tarball boots
        run: npm run test:pack

      - name: Release conformance
        run: npm run test:release

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # POST-publish verification — parity moved here from the pre-publish gate
  # after the 0.8.17 deadlock (auto-deploy made production advertise the
  # version being published, so the old pre-publish parity check failed on the
  # exact condition only the publish could clear). A mismatch here is a loud
  # red job on the release run, not a blocked release.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm serves what production advertises (parity, with propagation retries)
        run: node scripts/version-parity.mjs --retries 10 --interval-ms 30000

      - name: Install
        run: npm install

      - name: Conformance against the REGISTRY artifact
        # The strongest post-publish proof: what npm actually serves installs,
        # boots, and accepts the live service — not the tarball on this disk.
        run: node scripts/release-conformance.mjs --registry
