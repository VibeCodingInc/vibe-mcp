name: Publish to npm

# Publishes slashvibe-mcp from the PUBLIC source-of-record only, on a version
# tag (e.g. v0.8.17). The artifact tests run and must pass before publish; a
# failed pack/boot/conformance check stops the release before it reaches npm.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json ($PKG) != tag ($TAG)"; exit 1
          fi
          echo "version verified: $PKG"

      - name: Install
        run: npm install

      - name: Pack closure
        run: npm run pack:check

      - name: Unit tests
        run: npm test

      - name: Tarball boots
        run: npm run test:pack

      - name: Release conformance
        run: npm run test:release

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
