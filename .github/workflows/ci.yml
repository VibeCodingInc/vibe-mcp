name: CI

# Every push and PR runs the public artifact tests and a secret scan. This is
# the gate that keeps the source-of-record honest: the packed tarball must boot,
# the release conformance checks must pass, and no credential-shaped material may
# enter the tree (allowlist of confirmed false positives in .gitleaks.toml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Pack closure
        run: npm run pack:check
      - name: Unit tests
        run: npm test
      - name: Tarball boots
        run: npm run test:pack
      - name: Release conformance
        run: npm run test:release
      - name: Release ordering regression (the 0.8.17 deadlock)
        run: node --test test/release-deadlock.test.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned CLI)
        # Direct pinned CLI, not gitleaks-action@v2 (which exits before scanning
        # without an org license). Scans working tree + git history against the
        # allowlist in .gitleaks.toml; a real finding fails the job (exit 1).
        run: |
          set -euo pipefail
          VER=8.30.1
          # Integrity pin: hardcoded sha256 of the official linux_x64 archive,
          # verified independently at review time. A versioned URL is not a pin;
          # never fetch the checksum from the same release and call it verification.
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
